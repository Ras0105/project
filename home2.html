<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css"><!-- common (unchanged) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY LIBRARY</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #000000, #141414);
            color: bisque;
            font-family: cursive;
        }

        .wrap {
            position: relative;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 12px 0;
        }

        /* overlay icon */
        #hovi {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            z-index: 2;
            cursor: pointer;
        }

        /* lofi image responsive */
        #lofii {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            object-fit: cover; /* fills wide screens nicely */
        }

        /* audio full width */
        audio {
            width: 100%;
            height: 34px;
            margin: 10px 0 6px;
            display: block;
        }

        /* spotify buttons */
        .sp-group {
            display: flex;
            gap: 10px;
            padding: 0 12px 14px;
        }
        #sp, .sp-btn {
            background-color: bisque;
            color: #111;
            border: 1px solid #c9b79a;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.25s ease;
        }
        #sp:hover, .sp-btn:hover {
            background-color: #0e0e0e;
            color: bisque;
            border-color: bisque;
            transform: translateY(-1px);
        }

        /* mobile tweaks */
        @media (max-width: 768px) {
            #hovi { width: 32px; height: 32px; top: 12px; left: 12px; }
            .sp-group { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
   <div class="wrap">
       <a href="lofigirl.gif" target="_blank">
           <img id="hovi" src="1734111891922.png" alt="Open full">
       </a>

       <img id="lofii" src="lofigirl.gif" alt="A studying girl...">

       <audio controls loop>
           <source src="aud1.mp3" type="audio/mp3">
           Your browser does not support the audio element.
       </audio>

       <div class="sp-group">
           <a id="sp" href="https://open.spotify.com/embed/playlist/6zCID88oNjNv9zx6puDHKj?utm_source=generator&theme=0" target="_blank">Open</a>
           <a class="sp-btn" href="https://open.spotify.com/embed/playlist/0oPyDVNdgcPFAWmOYSK7O1?utm_source=generator&theme=0" target="_blank">Spotify</a>
       </div>
   </div>
</body>
</html>
